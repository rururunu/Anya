name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANYA_UPDATER_PUBKEY: ${{ secrets.ANYA_UPDATER_PUBKEY }}
          AAAI_UPDATER_PUBKEY: ${{ secrets.AAAI_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Anya ${{ github.ref_name }}
          releaseBody: See the assets attached to this release.
          releaseDraft: false
          prerelease: false
          args: --bundles msi

      - name: Rename MSI assets
        run: node scripts/rename-msi.mjs

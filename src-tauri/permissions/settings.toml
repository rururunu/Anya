[[permission]]
identifier = "allow-settings-commands"
description = "Enables settings read/write commands."
commands.allow = [
  "get_app_settings",
  "set_app_settings",
  "list_vscode_themes",
  "load_vscode_theme",
  "list_skills",
  "install_skill",
  "install_skill_markdown",
  "write_skill_meta",
  "uninstall_skill",
  "get_skills_dir",
  "open_skills_dir",
  "get_mcp_runtime_support",
  "list_mcp_server_statuses",
  "connect_mcp_server",
  "reauthenticate_mcp_server",
  "cache_install_icon",
  "lookup_install_icon",
  "lookup_install_icons",
  "clear_install_icon",
  "gemini_auth_status",
  "gemini_oauth_login",
  "gemini_oauth_cancel_login",
  "gemini_oauth_logout",
  "gemini_import_client_secrets",
  "get_semantic_search_status",
  "set_semantic_search",
  "test_semantic_search_api",
  "fetch_semantic_search_models",
]

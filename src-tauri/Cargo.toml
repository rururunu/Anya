[package]
name = "peek"
version = "0.2.10"
description = "Hand your work & questions to Anya anytime."
authors = ["you"]
edition = "2021"
default-run = "Anya"

[[bin]]
name = "Anya"
path = "src/main.rs"

[[bin]]
name = "anya-eval"
path = "src/bin/anya_eval.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
json5 = "0.4"
notify-rust = "4.18"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "blocking", "system-proxy", "socks"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rdev = "0.5"
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
regex = "1"
similar = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp", "png", "gif", "webp"] }
urlencoding = "2.1"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "implement",
] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tiktoken-rs = "0.12"
tauri-plugin-process = "2"
fastembed = "5.17.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
